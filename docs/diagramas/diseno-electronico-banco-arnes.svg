 Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="700" text-anchor="start">TP2</text><circle cx="780" cy="470" r="7" fill="#0E1A22"/><text x="800" y="458" font-family="Poppins, Calibri, Arial, sans-serif" font-size="18" fill="#0E1A22" font-weight="700" text-anchor="start">Q</text><circle cx="740" cy="470" r="5" fill="#11507D"/><path d="M740,470 L740,560 L324,560" fill="none" stroke="#11507D" stroke-width="2.5" stroke-linejoin="round"/><text x="480" y="550" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#11507D" font-weight="700" text-anchor="start">Q → A2</text><path d="M780,470 L780,520" fill="none" stroke="#0E1A22" stroke-width="2.5" stroke-linejoin="round"/><rect x="769" y="520" width="22" height="56" fill="#fff" stroke="#0E1A22" stroke-width="2.5"/><text x="800" y="545" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#0E1A22" font-weight="700" text-anchor="start">R2</text><text x="800" y="562" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#5B6B75" font-weight="400" text-anchor="start">10 kΩ</text><path d="M780,576 L780,610" fill="none" stroke="#0E1A22" stroke-width="2.5" stroke-linejoin="round"/><circle cx="780" cy="610" r="6" fill="#0E1A22"/><path d="M324,610 L1060,610" fill="none" stroke="#0E1A22" stroke-width="3" stroke-linejoin="round"/><circle cx="1060" cy="610" r="9" fill="#fff" stroke="#0E1A22" stroke-width="2.5"/><text x="1076" y="615" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="700" text-anchor="start">TP0</text><text x="400" y="636" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#5B6B75" font-weight="700" text-anchor="start">GND común (todas las tierras unidas)</text><text x="60" y="700" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Comprobación con el multímetro (punta negra en TP0, roja en TP1 o TP2)</text><rect x="60" y="716" width="990" height="34" fill="#11507D"/><text x="70" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Estado</text><text x="340" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">S1</text><text x="470" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">S2</text><text x="600" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">TP1</text><text x="710" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">TP2</text><text x="820" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">nodo_p</text><text x="930" y="739" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">nodo_q</text><rect x="60" y="750" width="990" height="36" fill="#ECFAFA" stroke="#D4F2F1"/><text x="70" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="700" text-anchor="start">Sano</text><text x="340" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">Cerrado</text><text x="470" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">Cerrado</text><text x="600" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">≈5 V</text><text x="710" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">≈5 V</text><text x="820" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">1</text><text x="930" y="774" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">1</text><rect x="60" y="786" width="990" height="36" fill="#FFFFFF" stroke="#D4F2F1"/><text x="70" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="700" text-anchor="start">Falla de alimentación</text><text x="340" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">Abierto</text><text x="470" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">Cerrado</text><text x="600" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">≈0 V</text><text x="710" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">≈5 V</text><text x="820" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">0</text><text x="930" y="810" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">1</text><rect x="60" y="822" width="990" height="36" fill="#ECFAFA" stroke="#D4F2F1"/><text x="70" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="700" text-anchor="start">Falla de señal</text><text x="340" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">Cerrado</text><text x="470" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">Abierto</text><text x="600" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">≈5 V</text><text x="710" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">≈0 V</text><text x="820" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">1</text><text x="930" y="846" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#0E1A22" font-weight="400" text-anchor="start">0</text><text x="60" y="880" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#5B6B75" font-weight="400" text-anchor="start" font-style="italic">TP1 y TP2 quedan después de los interruptores. Con 3,3 V (ESP32) las lecturas serían ≈3,3 V: los GPIO no aceptan 5 V directos.</text><rect x="1130" y="150" width="320" height="350" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><text x="1148" y="184" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Componentes</text><text x="1148" y="218" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• Arduino Uno R3 dedicado al banco</text><text x="1148" y="250" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• S1, S2: interruptores simples</text><text x="1148" y="282" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• R1, R2: 10 kΩ a GND (referencia)</text><text x="1148" y="314" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• R3, R4: 1 kΩ en serie a los bornes</text><text x="1148" y="346" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• TP0, TP1, TP2: bornes de prueba</text><text x="1148" y="378" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• Cables, base de montaje, cable USB</text><text x="1148" y="410" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• Multímetro con puntas negra y roja</text><rect x="1130" y="520" width="320" height="130" rx="12" fill="#FFF6E5" stroke="#E5A936" stroke-width="2"/><text x="1148" y="552" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#684800" font-weight="700" text-anchor="start">Seguridad</text><text x="1148" y="580" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13.5" fill="#684800" font-weight="400" text-anchor="start">Solo 5 V por USB, separado de</text><text x="1148" y="602" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13.5" fill="#684800" font-weight="400" text-anchor="start">cualquier sistema real del autobús.</text><text x="1148" y="624" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13.5" fill="#684800" font-weight="400" text-anchor="start">Conecta con el USB desconectado.</text></svg>