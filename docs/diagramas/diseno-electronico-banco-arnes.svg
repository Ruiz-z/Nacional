<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="pta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#11507D"/></marker></defs><rect width="1500" height="900" fill="#FFFFFF"/><rect width="1500" height="86" fill="#0E1A22"/><text x="40" y="42" font-family="Poppins, Calibri, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start">Diseño electrónico · Banco de arnés</text><text x="40" y="70" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#9ADCDC" font-weight="400" text-anchor="start">Maqueta didáctica de 5 V por USB con Arduino Uno R3 · dos averías con el mismo síntoma</text><rect x="60" y="130" width="250" height="520" rx="14" fill="#0E1A22"/><text x="185" y="166" font-family="Poppins, Calibri, Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">Arduino Uno R3</text><text x="185" y="188" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#9ADCDC" font-weight="400" text-anchor="middle">alimentado por USB</text><rect x="296" y="230" width="28" height="20" fill="#1AA7A6"/><text x="280" y="245" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="end">A1</text><rect x="296" y="300" width="28" height="20" fill="#1AA7A6"/><text x="280" y="315" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="end">5V</text><rect x="296" y="550" width="28" height="20" fill="#1AA7A6"/><text x="280" y="565" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="end">A2</text><rect x="296" y="600" width="28" height="20" fill="#1AA7A6"/><text x="280" y="615" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="end">GND