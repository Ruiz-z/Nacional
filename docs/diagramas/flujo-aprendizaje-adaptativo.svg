<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960"><defs><marker id="pta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#11507D"/></marker></defs><rect width="1700" height="960" fill="#FFFFFF"/><rect width="1700" height="86" fill="#0E1A22"/><text x="40" y="42" font-family="Poppins, Calibri, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start">Flujo del aprendizaje adaptativo</text><text x="40" y="70" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#9ADCDC" font-weight="400" text-anchor="start">Técnicos del Mañana · cada decisión se apoya en el dominio que muestra el técnico por competencia</text><rect x="40" y="120" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="70" cy="148" r="15" fill="#1AA7A6"/><text x="70" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="94" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Ingreso con cuenta</text><text x="58" y="182" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Usuario y contraseña con rol:</text><text x="58" y="203" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">técnico, jefe directo o admin.</text><text x="58" y="224" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">El técnico empieza solo con el</text><text x="58" y="245" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">diagnóstico abierto.</text><rect x="440" y="120" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="470" cy="148" r="15" fill="#1AA7A6"/><text x="470" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="494" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Diagnóstico</text><text x="458" y="182" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">10 reactivos del banco, distintos</text><text x="458" y="203" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">para cada técnico.</text><text x="458" y="224" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Si falla la pregunta media de una</text><text x="458" y="245" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">competencia, la siguiente baja a fácil.</text><rect x="840" y="120" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="870" cy="148" r="15" fill="#1AA7A6"/><text x="870" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="894" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Dominio por competencia</text><text x="858" y="182" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">4 competencias, últimos 10 intentos.</text><text x="858" y="203" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Peso: fácil 1, media 2, difícil 3;</text><text x="858" y="224" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">la práctica pesa el doble.</text><text x="858" y="245" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Novato &lt;40 · Básico &lt;70 ·</text><text x="858" y="266" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Competente &lt;90 · Experto</text><rect x="1240" y="120" width="360" height="215" rx="12" fill="#E3F3FA" stroke="#11507D" stroke-width="2"/><circle cx="1270" cy="148" r="15" fill="#1AA7A6"/><text x="1270" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="1294" y="154" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Ruta de aprendizaje</text><text x="1258" y="182" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Orden: falta crítica, brechas y</text><text x="1258" y="203" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">dominio; seguridad pesa doble.</text><text x="1258" y="224" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Faro propone y explica con los</text><text x="1258" y="245" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">manuales; la app valida y cita.</text><text x="1258" y="266" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Sin internet: orden calculado local.</text><rect x="1240" y="410" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="1270" cy="438" r="15" fill="#1AA7A6"/><text x="1270" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="1294" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Estudio asignado</text><text x="1258" y="472" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Materiales publicados por un jefe</text><text x="1258" y="493" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">directo, según la ruta y el nivel:</text><text x="1258" y="514" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">el del técnico y el siguiente.</text><text x="1258" y="535" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Tarjetas, quiz y juegos.</text><rect x="840" y="410" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="870" cy="438" r="15" fill="#1AA7A6"/><text x="870" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="894" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Práctica en el taller</text><text x="858" y="472" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Primero el EPP de la tarea.</text><text x="858" y="493" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Órdenes por nivel y competencia:</text><text x="858" y="514" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Fácil siempre · Media desde 50 ·</text><text x="858" y="535" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Difícil desde 75 de dominio.</text><text x="858" y="556" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Se registran errores por tipo.</text><rect x="440" y="410" width="360" height="215" rx="12" fill="#E3F3FA" stroke="#11507D" stroke-width="2"/><circle cx="470" cy="438" r="15" fill="#1AA7A6"/><text x="470" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><text x="494" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Se actualiza el dominio</text><text x="458" y="472" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Cada orden resuelta o fallida suma</text><text x="458" y="493" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">intentos y mueve el dominio.</text><text x="458" y="514" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">La ruta se recalcula y abre o</text><text x="458" y="535" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">cierra niveles de las órdenes.</text><rect x="440" y="700" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="470" cy="728" r="15" fill="#1AA7A6"/><text x="470" y="734" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text><text x="494" y="734" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Evaluación (post-test)</text><text x="458" y="762" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Mismas competencias con preguntas</text><text x="458" y="783" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">distintas a las del diagnóstico.</text><text x="458" y="804" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Mide la ganancia frente al inicio.</text><rect x="840" y="700" width="360" height="215" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><circle cx="870" cy="728" r="15" fill="#1AA7A6"/><text x="870" y="734" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">9</text><text x="894" y="734" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Retest diferido</text><text x="858" y="762" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Se repite a los 7 días simulados.</text><text x="858" y="783" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Repetición espaciada (Leitner)</text><text x="858" y="804" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">para medir cuánto se retiene.</text><rect x="1240" y="700" width="360" height="215" rx="12" fill="#11507D" stroke="#11507D" stroke-width="2"/><circle cx="1270" cy="728" r="15" fill="#1AA7A6"/><text x="1270" y="734" font-family="Poppins, Calibri, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">10</text><text x="1294" y="734" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Tablero y decisión</text><text x="1258" y="762" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">Ganancia, retención y errores</text><text x="1258" y="783" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">recurrentes, con evidencia.</text><text x="1258" y="804" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">Es una recomendación: el jefe</text><text x="1258" y="825" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">directo decide el avance de nivel.</text><path d="M400,227 L440,227" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M800,227 L840,227" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M1200,227 L1240,227" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M1420,335 L1420,410" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M1240,517 L1200,517" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M840,517 L800,517" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M620,625 L620,700" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M800,807 L840,807" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M1200,807 L1240,807" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M740,410 L740,374 L930,374 L930,335" fill="none" stroke="#1AA7A6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#pta)"/><text x="910" y="355" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#1AA7A6" font-weight="700" text-anchor="end">Ciclo adaptativo: cada práctica cambia el dominio y reordena la ruta</text><rect x="40" y="410" width="360" height="505" rx="12" fill="#FFFFFF" stroke="#D4F2F1" stroke-width="2" stroke-dasharray="6 5"/><text x="58" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Qué adapta el sistema</text><text x="58" y="478" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• La dificultad de las preguntas del diagnóstico.</text><text x="58" y="505" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• El orden de la ruta, por competencia.</text><text x="58" y="532" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• Los materiales que recibe cada técnico.</text><text x="58" y="559" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• Las órdenes que se abren en el taller.</text><text x="58" y="586" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• El equipo de EPP que exige cada tarea.</text><text x="58" y="613" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">• Qué repasar: cada tipo de error tiene</text><text x="58" y="640" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">   su práctica de refuerzo.</text><text x="58" y="890" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#5B6B75" font-weight="400" text-anchor="start" font-style="italic">Faro (IA) ayuda con la ruta y los materiales; sin</text><text x="58" y="909" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#5B6B75" font-weight="400" text-anchor="start" font-style="italic">internet el flujo sigue con un respaldo local.</text></svg>