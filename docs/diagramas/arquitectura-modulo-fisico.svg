<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="940" viewBox="0 0 1700 940"><defs><marker id="pta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#11507D"/></marker></defs><rect width="1700" height="940" fill="#FFFFFF"/><rect width="1700" height="86" fill="#0E1A22"/><text x="40" y="42" font-family="Poppins, Calibri, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start">Arquitectura del módulo físico</text><text x="40" y="70" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#9ADCDC" font-weight="400" text-anchor="start">Del hardware al simulador · protocolo JSON v1, un mensaje por línea · todo con respaldo virtual</text><rect x="40" y="130" width="420" height="230" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><text x="56" y="164" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Panel físico</text><text x="58" y="192" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">ESP32 Dev Module o Arduino Uno</text><text x="58" y="213" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Interruptores: bloqueo y etiquetado</text><text x="58" y="234" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Botones: confirmar y cancelar</text><text x="58" y="255" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Perilla de torque (0 a 100)</text><text x="58" y="276" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">3 LED: energizado, bloqueado, falla</text><rect x="40" y="400" width="420" height="210" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><text x="56" y="434" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Banco de arnés (Arduino Uno)</text><text x="58" y="462" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">S1 y S2 con puntos de prueba</text><text x="58" y="483" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">TP0, TP1 y TP2, 5 V por USB</text><text x="58" y="504" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Lee los nodos P y Q (A1 y A2)</text><text x="58" y="525" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Reporta nodo_p y nodo_q</text><rect x="40" y="650" width="420" height="240" rx="12" fill="#ECFAFA" stroke="#11507D" stroke-width="2"/><text x="56" y="684" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">Banco con ESP32 (Wi-Fi, 3,3 V)</text><text x="58" y="712" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Crea su propia red Wi-Fi</text><text x="58" y="733" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Espera INICIO por UDP 4210</text><text x="58" y="754" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Reporta {"tp1":0,"tp2":1}</text><text x="58" y="775" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">cada 250 ms</text><text x="58" y="796" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Los GPIO solo aceptan 3,3 V</text><rect x="620" y="400" width="440" height="210" rx="12" fill="#FFFFFF" stroke="#11507D" stroke-width="2"/><text x="636" y="434" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">puente_banco.py</text><text x="638" y="462" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Lee el USB serie a 115200 baudios</text><text x="638" y="483" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">y reenvía cada línea por UDP</text><text x="638" y="504" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">a 127.0.0.1:11521</text><rect x="620" y="650" width="440" height="240" rx="12" fill="#FFFFFF" stroke="#11507D" stroke-width="2"/><text x="636" y="684" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#0E1A22" font-weight="700" text-anchor="start">puente_esp32.py</text><text x="638" y="712" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">Recibe los bits del ESP32 por Wi-Fi</text><text x="638" y="733" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">y los traduce al protocolo del</text><text x="638" y="754" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">simulador. Envía latido mientras</text><text x="638" y="775" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="400" text-anchor="start">la placa responde</text><rect x="1220" y="130" width="440" height="760" rx="12" fill="#11507D" stroke="#11507D" stroke-width="2"/><text x="1236" y="164" font-family="Poppins, Calibri, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Simulador (Godot)</text><text x="1240" y="204" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">Recibe: v, ctrl, valor, n, t</text><text x="1240" y="234" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start"></text><text x="1240" y="264" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Filtro de entrada:</text><text x="1240" y="294" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">• descarta secuencias repetidas</text><text x="1240" y="324" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">• antirrebote de 50 ms por control</text><text x="1240" y="354" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">• el orden de llegada se conserva</text><text x="1240" y="384" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start"></text><text x="1240" y="414" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">Latido cada 1 s del dispositivo</text><text x="1240" y="444" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">Si faltan 3 s: pausa, avisa y pasa</text><text x="1240" y="474" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">al panel virtual o a la falla virtual</text><text x="1240" y="504" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start"></text><text x="1240" y="534" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Envía a los LED:</text><text x="1240" y="564" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">{"v":1,"led":"falla","valor":1}</text><text x="1240" y="594" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start"></text><text x="1240" y="624" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Registra la fuente de cada acción:</text><text x="1240" y="654" font-family="Poppins, Calibri, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="start">panel, virtual, teclado, control, banco</text><path d="M460,245 L1220,245" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><text x="840.0" y="235.0" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#11507D" font-weight="600" text-anchor="middle">USB serie 115200 · JSON v1</text><path d="M460,505 L620,505" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><path d="M1060,505 L1220,505" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><text x="1140.0" y="495.0" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#11507D" font-weight="600" text-anchor="middle">UDP local</text><path d="M460,770 L620,770" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><text x="540.0" y="760.0" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#11507D" font-weight="600" text-anchor="middle">Wi-Fi</text><path d="M1060,770 L1220,770" fill="none" stroke="#11507D" stroke-width="2.5" marker-end="url(#pta)"/><text x="1140.0" y="760.0" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#11507D" font-weight="600" text-anchor="middle">JSON v1</text><path d="M1220,330 L460,330" fill="none" stroke="#1AA7A6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#pta)"/><text x="830.0" y="320.0" font-family="Poppins, Calibri, Arial, sans-serif" font-size="13" fill="#1AA7A6" font-weight="600" text-anchor="middle">LED</text><text x="40" y="112" font-family="Poppins, Calibri, Arial, sans-serif" font-size="14" fill="#26343C" font-weight="600" text-anchor="start">Cada módulo es opcional: sin hardware el panel y el multímetro virtuales dan la misma práctica.</text></svg>